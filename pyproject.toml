[project]
name = "imagefind"
version = "0.1.0"
description = "Local tool to browse and search a folder of catalogued images."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pillow>=12.3.0",
    "uvicorn>=0.29",
]

[project.scripts]
imagefind = "imagefind.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["imagefind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
